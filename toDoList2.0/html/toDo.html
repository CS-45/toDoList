<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- headersection -->
    <div id="task-section">
      
      <header id="headerid " class="d-flex gap-4 justify-content-end py-3 px-2">
        <h3>welcome, <span id="userid"></span></h3>
        <button class="btn btn-danger" id="logoutbtn">logout</button>
      </header>

      <!-- entertaskbody -->
       <div class="taskbody">
       <h2 class="text-center py-2">ToDo Task</h2>
      <div class="container mt-2 taskcontainer shadow-lg d-flex justify-content-evenly text-align-center py-4">
        
        <div class="input-group mb-4 gap-4 w-50">
          <input
            type="text"
            id="inputtaskid"
            class="form-control"
            placeholder="enter your task"
          />
        </div>
        <div class="mt-1">
          <label for="taskDatetime" class="form-label"></label>
          <input type="datetime-local" id="taskDateTime" class="" />
        </div>
        <div class="statusbtns mt-2">
          <select name="" id="status">
            <option value="pending" selected>pending</option>
            <option value="done">done</option>
          </select>
        </div>
        <div>
          <button type="button" class="btn btn-success" id="action">
            Addtask
          </button>
        </div>
      </div>
      </div>
    </div>

    <!-- tablesection -->
    <div class="container py-4 px-4">
      <table class="table table-striped">
        <thead class="table-success">
          <tr>
            <th>ID</th>
            <th>TaskName</th>
            <th>Date & Time</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="taskbody">
          

          </div>
         
        </tbody>
      </table>
      <div id="pagination" style="text-align: center; margin-top: 10px;"></div>
    </div>
  </body>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/javscript/toDo.js"></script>
</html>
